# HTTP-only static SPA. TLS, public hosts, and tenant routing are deployment-owned.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Strip /api and forward to the backend on the Compose network so the
    # browser can call same-origin /api/* through shade-proxy → this nginx.
    location /api/ {
        # The catalog image-search endpoint accepts an image payload up to
        # 5 MiB. Leave room for multipart framing; the backend still enforces
        # the actual file limit.
        client_max_body_size 6m;
        proxy_pass http://${SHADE_API_UPSTREAM}/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tenant identity is proxy-owned and is never accepted from browser JS.
        proxy_set_header X-Forwarded-Host $host;
    }

    # Runtime configuration must be revalidated so restarting the same image
    # with different environment values takes effect immediately.
    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # The application entry point references hashed Vite assets and must be
    # revalidated instead of being retained as a long-lived cached document.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

        location = /favicon.png {
            try_files /favicon-shade.png =404;
            add_header Cache-Control "no-cache";
        }

    # Vite emits content-hashed production assets, so these may be cached for
    # a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router owns application routing. Unknown server-side paths fall
    # back to the SPA entry point so direct navigation and refresh work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
