# HTTP-only static SPA for the Shade Podman Compose deployment.
# Public TLS and host publishing live in shade-orchestrator (shade-proxy).
# This container is the only Compose service that talks to shade-backend.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Strip /api and forward to the backend on the Compose network so the
    # browser can call same-origin /api/* through shade-proxy → this nginx.
    location /api/ {
        proxy_pass http://shade-backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Caddy preserves the trusted public host in Host. Tenant identity is
        # proxy-owned and is never accepted from browser JavaScript.
        proxy_set_header X-Forwarded-Host $host;
    }

    # Runtime configuration must be revalidated so restarting the same image
    # with different environment values takes effect immediately.
    location = /config.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # The application entry point references hashed Vite assets and must be
    # revalidated instead of being retained as a long-lived cached document.
    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Vite emits content-hashed production assets, so these may be cached for
    # a long time.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router owns application routing. Unknown server-side paths fall
    # back to the SPA entry point so direct navigation and refresh work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
