# HTTP-only static SPA for local Podman. TLS is terminated elsewhere (e.g., Caddy in prod).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite/TanStack Router client routes need SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Immutable hashed assets from Vite; short cache for HTML.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
