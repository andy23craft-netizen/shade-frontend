name: Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    env:
      VITE_API_SECRET_KEY: test-api-token

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Verify pinned toolchain
        run: |
          node --version
          yarn --version

      - name: Cache Yarn packages
        uses: actions/cache@v4
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Run quality gate
        run: make check

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_API_SECRET_KEY: test-api-token
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build release tarball
        run: make publish

      - name: Publish release and artifact branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid package.json version: $version" >&2
            exit 1
          fi

          tag="v$version"
          filename="shade-frontend-$version.tar.gz"
          archive="ci/artifacts/$filename"
          source_sha="$GITHUB_SHA"
          if [[ ! -f "$archive" ]]; then
            echo "Expected release archive is missing: $archive" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" >/dev/null \
            || gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; bump package.json version before publishing." >&2
            exit 1
          fi

          release_file="$RUNNER_TEMP/$filename"
          cp "$archive" "$release_file"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin release-artifacts >/dev/null 2>&1; then
            git fetch --depth=1 origin refs/heads/release-artifacts:refs/remotes/origin/release-artifacts
            git checkout --force -B release-artifacts refs/remotes/origin/release-artifacts
          else
            git checkout --orphan release-artifacts
            git rm -rf --ignore-unmatch .
          fi

          branch_archive="$filename"
          if [[ -e "$branch_archive" ]]; then
            if ! cmp -s "$release_file" "$branch_archive"; then
              echo "Artifact $filename already exists with different bytes; bump package.json version." >&2
              exit 1
            fi
          else
            cp "$release_file" "$branch_archive"
            git add -- "$branch_archive"
            git commit -m "Publish Shade frontend $version"
            git push origin HEAD:refs/heads/release-artifacts
          fi

          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$source_sha" \
            --latest --title "$tag" "$release_file"
